<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RO’Lyfe Buyer Network OS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <h1>👥 RO’Lyfe Buyer Network OS</h1>
  <p class="sub">Source → Match → Fund → Close</p>

  <div class="card">
    <h2>📥 Buyer / Contractor Intake</h2>
    <p class="small">Public intake link for buyers, contractors, agents, landlords, and funding partners.</p>
    <button onclick="openBuyerIntake()">📥 Open Intake</button>
    <button onclick="copyBuyerIntake()">📋 Copy Intake Link</button>
  </div>

  <div class="card">
    <h2>➕ Add Buyer / Contractor</h2>

    <input id="name" placeholder="Name">
    <input id="phone" placeholder="Phone">
    <input id="email" placeholder="Email">
    <input id="company" placeholder="Company">

    <select id="role">
      <option>Cash Buyer</option>
      <option>Contractor Buyer</option>
      <option>Fix & Flip Investor</option>
      <option>Landlord / DSCR Buyer</option>
      <option>Agent Buyer</option>
      <option>Lender Referral</option>
    </select>

    <select id="tag">
      <option>VIP</option>
      <option>A Buyer</option>
      <option>B Buyer</option>
      <option>New Lead</option>
      <option>Do Not Send</option>
    </select>

    <input id="area" placeholder="Target Area">
    <input id="maxPrice" placeholder="Max Buy Price">
    <input id="rehabLevel" placeholder="Rehab Level: Light / Medium / Heavy">
    <input id="notes" placeholder="Buy Box / Notes">

    <button onclick="addBuyer()">➕ Add Contact</button>
  </div>

  <div class="card">
    <h2>🔥 Deal Match Engine</h2>

    <input id="dealAddress" placeholder="Deal Address">
    <input id="dealArea" placeholder="Deal Area">
    <input id="dealPrice" placeholder="Deal Price">
    <input id="dealARV" placeholder="ARV">
    <input id="dealRehab" placeholder="Estimated Rehab">

    <button onclick="matchDeal()">🔎 Match Buyers</button>
    <button onclick="buildDealBlast()">⚡ Build Deal Blast</button>

    <div id="matchResults"></div>
  </div>

  <div class="card">
    <h2>📲 Deal Blast</h2>
    <textarea id="dealMsg" placeholder="Deal blast message will appear here..."></textarea>

    <button onclick="copyBlast()">📋 Copy Blast</button>
    <button onclick="sendEmailBlast()">📧 Email Blast</button>
    <button onclick="sendSMSBlast()">📲 Text Blast</button>
  </div>

  <div class="card">
    <h2>📋 Buyer Network</h2>

    <input id="search" placeholder="Search buyers..." onkeyup="filterBuyers()">

    <div class="mini-row">
      <button onclick="exportBuyers()">📤 Copy Buyer List</button>
      <button onclick="clearAllBuyers()">🗑️ Clear All</button>
    </div>

    <div id="buyerList"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
